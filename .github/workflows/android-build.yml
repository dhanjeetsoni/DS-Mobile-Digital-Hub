name: Build Android Apps (Staff + Owner)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [staff, owner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          unzip -q DS_Mobile_Digital_Hub_v1_7_Step1_Complete.zip -d /tmp/ds-mobile
          PROJECT_DIR=$(find /tmp/ds-mobile -type f -name package.json -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          rsync -a "$PROJECT_DIR/" ./ --exclude='.git/'
          test -f package.json
          test -f src-tauri/Cargo.toml
          test -f src-tauri/tauri.${{ matrix.variant }}-android.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare Tauri mobile Rust library
        run: |
          test -f src-tauri/src/main.rs
          cp src-tauri/src/main.rs src-tauri/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/lib.rs')
          s = p.read_text(encoding='utf-8')
          if 'fn main(' not in s:
              raise SystemExit('Could not find fn main() in src-tauri/src/main.rs')
          s = s.replace('fn main(', '#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run(', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/Cargo.toml')
          s = p.read_text(encoding='utf-8')
          if '[lib]' not in s:
              s += '\n\n[lib]\nname = "ds_mobile_digital_hub_lib"\ncrate-type = ["staticlib", "cdylib", "rlib"]\n'
          else:
              print('Existing [lib] section detected; leaving it unchanged.')
          p.write_text(s, encoding='utf-8')
          PY
          cat > src-tauri/src/main.rs <<'EOF'
          fn main() {
              ds_mobile_digital_hub_lib::run();
          }
          EOF
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 > /tmp/cargo-metadata.json
          grep -q '"kind":\["lib"\]' /tmp/cargo-metadata.json

      - name: Initialize Android project for ${{ matrix.variant }}
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init --config src-tauri/tauri.${{ matrix.variant }}-android.conf.json

      - name: Verify Android package identity
        run: |
          echo "Expected: com.dsmobile.digitalhub.${{ matrix.variant }}"
          grep -R "com.dsmobile.digitalhub.${{ matrix.variant }}" src-tauri/gen/android/app/src/main 2>/dev/null | head -n 5 || true

      - name: Build ${{ matrix.variant }} APK
        env:
          VITE_APP_VARIANT: ${{ matrix.variant }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npx tauri android build --config src-tauri/tauri.${{ matrix.variant }}-android.conf.json --apk --debug

      - name: Collect APKs
        run: |
          mkdir -p artifacts/${{ matrix.variant }}
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} artifacts/${{ matrix.variant }}/ \;
          test -n "$(find artifacts/${{ matrix.variant }} -type f -name '*.apk' -print -quit)"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ds-mobile-${{ matrix.variant }}-apk
          path: artifacts/${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create build metadata
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('version-${{ matrix.variant }}.json', JSON.stringify({variant:'${{ matrix.variant }}',version:require('./package.json').version,commit:process.env.GITHUB_SHA,built_at:new Date().toISOString()},null,2))"

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: version-info-${{ matrix.variant }}
          path: version-${{ matrix.variant }}.json
          retention-days: 30
