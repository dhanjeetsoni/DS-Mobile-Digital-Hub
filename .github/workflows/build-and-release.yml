name: Build & Release (Step 12)

# Builds the Windows installer + Staff/Owner Android APKs and attaches
# them to a GitHub Release. This workflow only BUILDS and SIGNS — it never
# touches the app_versions table or Supabase. Publishing to real devices
# is always the separate, manual "upload + Make Live" step in the Owner
# app's App Versions panel (Step 12.3) — see STEP12-APP-UPDATE-SETUP.md.
#
# Trigger: either push a tag like v1.4.0, OR go to the Actions tab on
# GitHub.com, open this workflow, and click "Run workflow" (no git command
# needed for the manual path).
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - 'hardening/production-reliability-*'
      - 'hardening/selected-scope-*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this manual build (e.g. 1.0.0-test)"
        required: false
        default: "0.0.1-test"

# Superseded main-branch builds need not consume two native runners.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

jobs:
  validate:
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Record validated source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture dependency security audit
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v6
        with:
          name: dependency-security-audit
          path: dependency-audit.json
          if-no-files-found: error
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:static
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and required libraries
        shell: bash
        run: |
          set -euo pipefail
          # The unrelated Microsoft package feed occasionally denies hosted runners.
          # Disable only the stock Microsoft prod feed on this ephemeral Linux runner;
          # Ubuntu package signature checks and actual browser execution remain mandatory.
          for file in /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; do
            if [ -f "$file" ] && grep -q 'packages.microsoft.com/ubuntu/' "$file"; then
              sudo mv "$file" "$file.disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-visual-review
          path: visual-review/
          if-no-files-found: warn
          retention-days: 30
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Resolve pinned Rust dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Compute version string
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REQUESTED_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-ci.$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version label"; exit 1
          fi
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'APP_BUILD_NUMBER=%s\n' "$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Stamp native version and Android version code
        shell: bash
        run: node scripts/ci-stamp-native-version.mjs "$APP_VERSION" "$APP_BUILD_NUMBER"

      - name: Write .env (Windows build)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_APP_VARIANT=full" >> .env
          echo "VITE_APP_PLATFORM=windows" >> .env
          echo "VITE_APP_VERSION=${{ env.APP_VERSION }}" >> .env
          echo "VITE_APP_BUILD=${{ env.APP_BUILD_NUMBER }}" >> .env

      - name: Check signing key presence
        id: signing_check
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require updater signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing_check.outputs.has_key != 'true'
        run: exit 1

      - name: Disable updater signing if no key is set yet
        if: steps.signing_check.outputs.has_key == 'false'
        shell: bash
        run: |
          echo "No TAURI_SIGNING_PRIVATE_KEY secret found - building the installer WITHOUT updater signing."
          echo "The app will still install and run fine; only the in-app auto-update check will stay off until this secret is added."
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (c.bundle) c.bundle.createUpdaterArtifacts = false;
            if (c.plugins && c.plugins.updater) c.plugins.updater.active = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - name: Build (+ sign updater artifacts if key is set)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Verify Windows artifact presence and record SHA-256
        shell: pwsh
        env:
          REQUIRE_UPDATER_SIGNATURE: ${{ steps.signing_check.outputs.has_key }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem "$dir/*.exe" -File)
          if ($installers.Count -eq 0) { throw "No Windows installer produced" }
          $report = foreach ($file in $installers) {
            $signature = "$($file.FullName).sig"
            $hasSignature = (Test-Path $signature) -and ((Get-Item $signature).Length -gt 0)
            if ($env:REQUIRE_UPDATER_SIGNATURE -eq "true" -and !$hasSignature) { throw "Required updater signature missing" }
            if ($file.Length -lt 1024) { throw "Truncated installer" }
            [PSCustomObject]@{ file=$file.Name; bytes=$file.Length; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower(); updaterSignaturePresent=$hasSignature; source=$env:GITHUB_SHA; version=$env:APP_VERSION; build=$env:APP_BUILD_NUMBER }
          }
          ConvertTo-Json -InputObject @($report) -Depth 4 | Set-Content "$dir/windows-verification.json"
          Get-Content "$dir/windows-verification.json"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          # NSIS installer (.exe) + its updater .sig (only produced when
          # createUpdaterArtifacts stayed true, i.e. signing key was set),
          # and the MSI if produced.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/windows-verification.json
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Phase 17.2 (2026-09-20, PROJECT_PLAN.md): the dedicated "staff"
        # and "owner" Android APKs are retired — "mobile" (DS Mobile, the
        # unified login for both roles, see App.tsx's VITE_APP_VARIANT
        # handling) is now the only Android build this workflow produces.
        # No app_versions row had ever been published for any platform and
        # no real device had ever signed in (verified against the live
        # Supabase project before removing these) — so nothing depends on
        # the old builds still being produced.
        variant: [mobile]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy standalone "tools" package from the
          # Android SDK repository (~2026-09-14) -- this action's `packages`
          # input defaults to "tools platform-tools", so an unconfigured run
          # now hard-fails at "Failed to find package 'tools'" before any
          # build step even starts. Not an app-code issue: every project
          # using this action broke on the same day. platform-tools alone is
          # enough -- AGP/Gradle downloads whichever platform + build-tools
          # version this project needs on demand during `npm run
          # android:*:build` (this action already accepts the SDK licenses),
          # so nothing else needs to be listed here.
          packages: "platform-tools"

      - name: Install deps
        run: npm ci

      - name: Compute version string
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REQUESTED_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-ci.$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version label"; exit 1
          fi
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'APP_BUILD_NUMBER=%s\n' "$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Stamp native version and Android version code
        shell: bash
        run: node scripts/ci-stamp-native-version.mjs "$APP_VERSION" "$APP_BUILD_NUMBER"

      - name: Write .env (${{ matrix.variant }} Android build)
        # IMPORTANT: this must be plain ".env", not ".env.${{ matrix.variant }}".
        # `npm run build` (invoked below via `npm run android:*:build` ->
        # `tauri android build` -> tauri.conf.json's beforeBuildCommand)
        # runs a plain `vite build` with no --mode flag, so Vite only ever
        # loads .env / .env.local / .env.production / .env.production.local
        # — it silently ignores a file named .env.staff or .env.owner.
        # Writing to those names meant every Android build (both variants)
        # shipped with VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and
        # VITE_APP_VARIANT completely unset, so both APKs fell back to the
        # "full" (Windows-style chooser) variant with no cloud config at
        # all. Each matrix job (staff, owner) runs on its own fresh runner
        # checkout, so writing straight to .env here is safe — there's no
        # cross-variant collision.
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_APP_VARIANT=${{ matrix.variant }}" >> .env
          echo "VITE_APP_PLATFORM=${{ matrix.variant }}-android" >> .env
          echo "VITE_APP_VERSION=${{ env.APP_VERSION }}" >> .env
          echo "VITE_APP_BUILD=${{ env.APP_BUILD_NUMBER }}" >> .env

      - name: Build frontend (dist/) explicitly before Android packaging
        # ROOT CAUSE of the blank/white-screen bug: `tauri android build`'s
        # beforeBuildCommand (`npm run build` from tauri.conf.json) was
        # relied on to produce dist/ right before Android packaging step,
        # but for `tauri android build` specifically this hook was not
        # reliably producing a populated dist/ before the Gradle asset-copy
        # task ran — shipped APKs ended up with assets/ containing only
        # tauri.conf.json and dexopt files, no index.html/JS/CSS at all, so
        # the WebView had literally nothing to render (blank white screen,
        # not even the boot-fallback overlay, since index.html itself was
        # missing). Building dist/ explicitly and verifying it here, before
        # `tauri android init`/`build` ever runs, guarantees the frontend
        # bundle exists and gets picked up.
        run: |
          npm run build
          echo "----- dist/ contents -----"
          ls -la dist
          test -f dist/index.html || (echo "::error::dist/index.html missing after npm run build — aborting before packaging a blank APK" && exit 1)

      - name: tauri android init (safe to repeat; regenerates gen/android from scratch every run)
        # Must use the same per-variant config as the build step below.
        # Without --config here, this generates the Android project using
        # the base tauri.conf.json identifier (com.dsmobile.digitalhub),
        # while the build step uses tauri.<variant>-android.conf.json's
        # identifier (com.dsmobile.digitalhub.<variant>) — the Java package
        # path Tauri looks for then doesn't exist, and the build fails.
        #
        # NOTE: this does NOT generate a keystore.properties, and the
        # generated build.gradle.kts has no signingConfigs / release
        # signing wiring at all — that's a manual one-time edit per
        # Tauri's own Android signing guide. Because gen/android is
        # gitignored (regenerated fresh every run), a manual edit would
        # never survive — so the next step wires it up programmatically
        # instead, every run.
        run: npx tauri android init --config src-tauri/tauri.${{ matrix.variant }}-android.conf.json

      - name: Wire release signing into build.gradle.kts (idempotent, always run)
        # `tauri android init`'s template never adds a signingConfigs
        # block or assigns one to the "release" buildType (confirmed
        # against Tauri's own template source), so without this step the
        # release build is always unsigned regardless of secrets.
        run: node scripts/ci-wire-android-signing.mjs src-tauri/gen/android/app/build.gradle.kts

      - name: Wire Bluetooth permissions into AndroidManifest.xml (Phase 4 thermal printer, idempotent, always run)
        # `tauri android init`'s template has no Bluetooth permissions at
        # all, so without this step the Bluetooth Print feature
        # (src/services/thermalPrinter.ts) has no chance of working on a
        # release APK regardless of whether the WebView itself supports
        # Web Bluetooth.
        run: node scripts/ci-wire-android-bluetooth-permissions.mjs src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Wire Camera permission into AndroidManifest.xml (barcode/QR scanner, idempotent, always run)
        # `tauri android init`'s template has no CAMERA permission at all,
        # so getUserMedia() in CameraScannerModal.tsx always failed with
        # "Camera access denied or unavailable" on every release APK,
        # regardless of what the user tapped on the OS permission dialog
        # (there was no dialog — the app was never even allowed to ask).
        run: node scripts/ci-wire-android-camera-permissions.mjs src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Wire Biometric permission into AndroidManifest.xml (fingerprint/Face unlock, idempotent, always run)
        # @tauri-apps/plugin-biometric's own bundled manifest declares no
        # USE_BIOMETRIC permission (verified directly against its published
        # source) — without this step, checkStatus() always reports
        # isAvailable: false on a real device regardless of hardware.
        run: node scripts/ci-wire-android-biometric-permission.mjs src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Require Android release keystore for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"

      - name: Write keystore.properties (if the release keystore secret is set)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Release keystore secret found - this build will be signed with your real release key."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "storeFile=$RUNNER_TEMP/release.keystore"
            } > src-tauri/gen/android/keystore.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set yet - no keystore.properties written."
            echo "The signing config injected above falls back to the auto-generated DEBUG key for the release build type, so this still produces an installable debug-signed APK — just not Play-Store-ready."
          fi

      - name: Cache Gradle dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.toml', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-

      - name: Build ${{ matrix.variant }} Android APK
        shell: bash
        run: |
          # Maven Central/Gradle can return HTTP 429 on hosted runners.
          # Back off only for identifiable transient failures; never mask compile/signing errors.
          set -o pipefail
          for attempt in 1 2 3 4; do
            log="$RUNNER_TEMP/android-build-$attempt.log"
            if npm run android:${{ matrix.variant }}:build 2>&1 | tee "$log"; then exit 0; fi
            if [ "$attempt" = "4" ]; then exit 1; fi
            if ! grep -Eqi 'status code (429|502|503|504)|Too Many Requests|Connection reset|Read timed out|checksum failed|Could not GET.*(timed out|temporarily)' "$log"; then
              echo "::error::Non-transient Android build failure"; exit 1
            fi
            delay=$((60 * 2 ** (attempt - 1)))
            echo "::warning::Transient Android dependency failure; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Rename APK with variant name (Tauri gives Staff and Owner builds the identical filename otherwise)
        # Both matrix jobs produce a file literally named e.g. "app-universal-release.apk"
        # under their own outputs/apk folder — fine as separate build artifacts (different
        # artifact NAME above keeps them apart), but the release job below downloads every
        # artifact into one shared "dist-artifacts" folder and attaches every file to one
        # GitHub Release. GitHub Release assets must have unique filenames, so whichever
        # variant's identically-named .apk uploads second silently overwrites/replaces the
        # first — one whole variant (Staff or Owner) has been missing from every Release,
        # even though both built successfully. Renaming here (each variant's own build
        # step, before either touches the shared folder) is the fix.
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f"); base=$(basename "$f" .apk)
            mv "$f" "$dir/${base}-${{ matrix.variant }}.apk"
          done

      - name: Verify packaged APK, permissions, signing and version
        shell: bash
        env:
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/verify-native-apk.py src-tauri/gen/android/app/build/outputs/apk "$APP_BUILD_NUMBER" dist

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant }}-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/apk-verification.json
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    # Needed so the built-in GITHUB_TOKEN can create a Release and attach
    # files to it — without this the repo's default (read-only) token
    # permissions make softprops/action-gh-release fail with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: windows-installer
          path: dist-artifacts
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-android-apk"
          path: dist-artifacts

      - name: Create GitHub Release with all builds attached
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-run{1}', github.event.inputs.version, github.run_number) || github.ref_name }}
          # Attach every build so a human downloads + uploads them into the
          # Owner app's App Versions panel - this workflow never publishes
          # to app_versions/Supabase itself (see file header comment).
          files: dist-artifacts/**/*
