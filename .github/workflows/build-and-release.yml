name: Build & Release (Step 12)

# Builds the Windows installer + Staff/Owner Android APKs and attaches
# them to a GitHub Release. This workflow only BUILDS and SIGNS — it never
# touches the app_versions table or Supabase. Publishing to real devices
# is always the separate, manual "upload + Make Live" step in the Owner
# app's App Versions panel (Step 12.3) — see STEP12-APP-UPDATE-SETUP.md.
#
# Trigger: push a tag like v1.4.0.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Write .env (Windows build)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_APP_VARIANT=full" >> .env
          echo "VITE_APP_PLATFORM=windows" >> .env
          echo "VITE_APP_VERSION=${GITHUB_REF_NAME#v}" >> .env
          echo "VITE_APP_BUILD=${{ github.run_number }}" >> .env

      - name: Build + sign (Tauri Updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # NSIS installer (.exe) + its updater .sig (createUpdaterArtifacts:
          # true in tauri.conf.json), and the MSI if produced.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [staff, owner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Write .env (${{ matrix.variant }} Android build)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.${{ matrix.variant }}
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env.${{ matrix.variant }}
          echo "VITE_APP_VARIANT=${{ matrix.variant }}" >> .env.${{ matrix.variant }}
          echo "VITE_APP_PLATFORM=${{ matrix.variant }}-android" >> .env.${{ matrix.variant }}
          echo "VITE_APP_VERSION=${GITHUB_REF_NAME#v}" >> .env.${{ matrix.variant }}
          echo "VITE_APP_BUILD=${{ github.run_number }}" >> .env.${{ matrix.variant }}

      - name: Decode Android signing keystore
        shell: bash
        run: |
          # One-time setup needed: generate a keystore with
          # `keytool -genkeypair -v -keystore release.keystore -alias ds-mobile -keyalg RSA -keysize 2048 -validity 10000`
          # then base64 it and store as the ANDROID_KEYSTORE_BASE64 secret,
          # plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD. Without
          # these secrets set, this step produces an empty/invalid keystore
          # and the build below will fail — that's expected until you add them.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: tauri android init (first run only, safe to repeat)
        run: npx tauri android init

      - name: Build ${{ matrix.variant }} Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:${{ matrix.variant }}:build

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release with all builds attached
        uses: softprops/action-gh-release@v2
        with:
          # Attach every build so a human downloads + uploads them into the
          # Owner app's App Versions panel — this workflow never publishes
          # to app_versions/Supabase itself (see file header comment).
          files: dist-artifacts/**/*
