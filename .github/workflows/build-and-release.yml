name: Build & Release (Step 12)

# Builds the Windows installer + Staff/Owner Android APKs and attaches
# them to a GitHub Release. This workflow only BUILDS and SIGNS — it never
# touches the app_versions table or Supabase. Publishing to real devices
# is always the separate, manual "upload + Make Live" step in the Owner
# app's App Versions panel (Step 12.3) — see STEP12-APP-UPDATE-SETUP.md.
#
# Trigger: either push a tag like v1.4.0, OR go to the Actions tab on
# GitHub.com, open this workflow, and click "Run workflow" (no git command
# needed for the manual path).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this manual build (e.g. 1.0.0-test)"
        required: false
        default: "0.0.1-test"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Compute version string
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "APP_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Write .env (Windows build)
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_APP_VARIANT=full" >> .env
          echo "VITE_APP_PLATFORM=windows" >> .env
          echo "VITE_APP_VERSION=${{ env.APP_VERSION }}" >> .env
          echo "VITE_APP_BUILD=${{ github.run_number }}" >> .env

      - name: Check signing key presence
        id: signing_check
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable updater signing if no key is set yet
        if: steps.signing_check.outputs.has_key == 'false'
        shell: bash
        run: |
          echo "No TAURI_SIGNING_PRIVATE_KEY secret found - building the installer WITHOUT updater signing."
          echo "The app will still install and run fine; only the in-app auto-update check will stay off until this secret is added."
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (c.bundle) c.bundle.createUpdaterArtifacts = false;
            if (c.plugins && c.plugins.updater) c.plugins.updater.active = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - name: Build (+ sign updater artifacts if key is set)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          # NSIS installer (.exe) + its updater .sig (only produced when
          # createUpdaterArtifacts stayed true, i.e. signing key was set),
          # and the MSI if produced.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [staff, owner]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Compute version string
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "APP_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Write .env (${{ matrix.variant }} Android build)
        # IMPORTANT: this must be plain ".env", not ".env.${{ matrix.variant }}".
        # `npm run build` (invoked below via `npm run android:*:build` ->
        # `tauri android build` -> tauri.conf.json's beforeBuildCommand)
        # runs a plain `vite build` with no --mode flag, so Vite only ever
        # loads .env / .env.local / .env.production / .env.production.local
        # — it silently ignores a file named .env.staff or .env.owner.
        # Writing to those names meant every Android build (both variants)
        # shipped with VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and
        # VITE_APP_VARIANT completely unset, so both APKs fell back to the
        # "full" (Windows-style chooser) variant with no cloud config at
        # all. Each matrix job (staff, owner) runs on its own fresh runner
        # checkout, so writing straight to .env here is safe — there's no
        # cross-variant collision.
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_APP_VARIANT=${{ matrix.variant }}" >> .env
          echo "VITE_APP_PLATFORM=${{ matrix.variant }}-android" >> .env
          echo "VITE_APP_VERSION=${{ env.APP_VERSION }}" >> .env
          echo "VITE_APP_BUILD=${{ github.run_number }}" >> .env

      - name: Build frontend (dist/) explicitly before Android packaging
        # ROOT CAUSE of the blank/white-screen bug: `tauri android build`'s
        # beforeBuildCommand (`npm run build` from tauri.conf.json) was
        # relied on to produce dist/ right before Android packaging step,
        # but for `tauri android build` specifically this hook was not
        # reliably producing a populated dist/ before the Gradle asset-copy
        # task ran — shipped APKs ended up with assets/ containing only
        # tauri.conf.json and dexopt files, no index.html/JS/CSS at all, so
        # the WebView had literally nothing to render (blank white screen,
        # not even the boot-fallback overlay, since index.html itself was
        # missing). Building dist/ explicitly and verifying it here, before
        # `tauri android init`/`build` ever runs, guarantees the frontend
        # bundle exists and gets picked up.
        run: |
          npm run build
          echo "----- dist/ contents -----"
          ls -la dist
          test -f dist/index.html || (echo "::error::dist/index.html missing after npm run build — aborting before packaging a blank APK" && exit 1)

      - name: tauri android init (safe to repeat; regenerates gen/android from scratch every run)
        # Must use the same per-variant config as the build step below.
        # Without --config here, this generates the Android project using
        # the base tauri.conf.json identifier (com.dsmobile.digitalhub),
        # while the build step uses tauri.<variant>-android.conf.json's
        # identifier (com.dsmobile.digitalhub.<variant>) — the Java package
        # path Tauri looks for then doesn't exist, and the build fails.
        #
        # NOTE: this does NOT generate a keystore.properties, and the
        # generated build.gradle.kts has no signingConfigs / release
        # signing wiring at all — that's a manual one-time edit per
        # Tauri's own Android signing guide. Because gen/android is
        # gitignored (regenerated fresh every run), a manual edit would
        # never survive — so the next step wires it up programmatically
        # instead, every run.
        run: npx tauri android init --config src-tauri/tauri.${{ matrix.variant }}-android.conf.json

      - name: Wire release signing into build.gradle.kts (idempotent, always run)
        # `tauri android init`'s template never adds a signingConfigs
        # block or assigns one to the "release" buildType (confirmed
        # against Tauri's own template source), so without this step the
        # release build is always unsigned regardless of secrets.
        run: node scripts/ci-wire-android-signing.mjs src-tauri/gen/android/app/build.gradle.kts

      - name: Write keystore.properties (if the release keystore secret is set)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Release keystore secret found - this build will be signed with your real release key."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "storeFile=$RUNNER_TEMP/release.keystore"
            } > src-tauri/gen/android/keystore.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set yet - no keystore.properties written."
            echo "The signing config injected above falls back to the auto-generated DEBUG key for the release build type, so this still produces an installable debug-signed APK — just not Play-Store-ready."
          fi

      - name: Build ${{ matrix.variant }} Android APK
        run: npm run android:${{ matrix.variant }}:build

      - name: Rename APK with variant name (Tauri gives Staff and Owner builds the identical filename otherwise)
        # Both matrix jobs produce a file literally named e.g. "app-universal-release.apk"
        # under their own outputs/apk folder — fine as separate build artifacts (different
        # artifact NAME above keeps them apart), but the release job below downloads every
        # artifact into one shared "dist-artifacts" folder and attaches every file to one
        # GitHub Release. GitHub Release assets must have unique filenames, so whichever
        # variant's identically-named .apk uploads second silently overwrites/replaces the
        # first — one whole variant (Staff or Owner) has been missing from every Release,
        # even though both built successfully. Renaming here (each variant's own build
        # step, before either touches the shared folder) is the fix.
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f"); base=$(basename "$f" .apk)
            mv "$f" "$dir/${base}-${{ matrix.variant }}.apk"
          done

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant }}-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    # Needed so the built-in GITHUB_TOKEN can create a Release and attach
    # files to it — without this the repo's default (read-only) token
    # permissions make softprops/action-gh-release fail with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist-artifacts

      - name: Create GitHub Release with all builds attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-run{1}', github.event.inputs.version, github.run_number) || github.ref_name }}
          # Attach every build so a human downloads + uploads them into the
          # Owner app's App Versions panel - this workflow never publishes
          # to app_versions/Supabase itself (see file header comment).
          files: dist-artifacts/**/*
