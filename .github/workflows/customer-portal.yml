name: Build public customer storefront
on:
  workflow_dispatch:
  push:
    branches: [main, 'hardening/selected-scope-*']
    paths: ['customer-portal/**','scripts/customer-portal-smoke.mjs','.github/workflows/customer-portal.yml']
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --check customer-portal/catalog.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/customer-portal-smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: customer-portal-static
          path: customer-portal/
          if-no-files-found: error
