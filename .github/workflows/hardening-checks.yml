name: Hardening checks
on:
  pull_request:
  push:
    branches:
      - 'hardening/**'
      - main
concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:static
      - run: npm run build
      - name: Install browser smoke runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run built application in Chromium
        run: node scripts/browser-smoke.mjs
