name: Hardening checks
on:
  pull_request:
  push:
    branches:
      - 'hardening/**'
      - main
concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:static
      - run: python3 scripts/test-verify-native-apk.py
      - run: node scripts/test-verify-windows-updater.mjs
      - run: npm run build
      - name: Install browser smoke runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and required libraries
        shell: bash
        run: |
          set -euo pipefail
          # The unrelated Microsoft package feed occasionally denies hosted runners.
          # Disable only the stock Microsoft prod feed on this ephemeral Linux runner;
          # Ubuntu package signature checks and actual browser execution remain mandatory.
          for file in /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; do
            if [ -f "$file" ] && grep -q 'packages.microsoft.com/ubuntu/' "$file"; then
              sudo mv "$file" "$file.disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - name: Run built application in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Upload actual UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual-review/
          if-no-files-found: warn
          retention-days: 30
