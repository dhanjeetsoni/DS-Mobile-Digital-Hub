name: Recheck existing Android APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Build & Release workflow run ID in this repository"
        required: true
        type: string
      expected_sha:
        description: "Exact source commit SHA of the existing APK"
        required: true
        type: string
  push:
    branches: ['hardening/native-deepcheck-*']
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '46126012280' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || 'd21e3eeab94fef291907387c36ac63737001bbfe' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .name == "Build & Release (Step 12)" and .status == "completed"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" | jq -e 'any(.jobs[]; .name == "android (mobile)" and .conclusion == "success")'
      - uses: actions/download-artifact@v7
        with:
          name: mobile-android-apk
          path: emulator-apk
          run-id: ${{ inputs.run_id || '46126012280' }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual packaged mobile login
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh emulator-apk android-runtime-review
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: existing-apk-runtime-review
          path: android-runtime-review/
          if-no-files-found: warn
